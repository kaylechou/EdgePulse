<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdgePulse Trojan 管理面板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <!-- 登录层 -->
    <div id="loginOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-6">管理登录</h2>
            <input type="password" id="adminPassword" class="w-full p-3 bg-slate-100 rounded-lg mb-4 text-center tracking-widest outline-orange-500" placeholder="输入 ADMIN_PASS">
            <button onclick="login()" class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white rounded-lg font-bold transition">确认进入</button>
            <p id="loginError" class="text-red-500 text-sm mt-3 hidden">鉴权失败，请检查环境变量</p>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainContent" class="max-w-4xl mx-auto p-4 md:p-8 opacity-0 transition-opacity duration-500">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-orange-500">EdgePulse <span class="text-slate-400 font-normal">Dashboard</span></h1>
            <button onclick="saveConfig()" class="px-6 py-2 bg-orange-500 text-white rounded-lg font-bold shadow-lg shadow-orange-200">保存设置</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="glass p-6 rounded-2xl">
                <h3 class="font-bold mb-4 flex justify-between">
                    <span>📡 节点状态</span>
                    <button onclick="testPing()" class="text-xs text-blue-500">点此测试</button>
                </h3>
                <div class="p-4 bg-white/50 rounded-xl border border-slate-100">
                    <p id="pingStatus" class="text-sm font-medium">就绪</p>
                    <p id="pingMs" class="text-xs text-slate-400">延迟: -- ms</p>
                </div>
            </div>
            <div class="glass p-6 rounded-2xl">
                <h3 class="font-bold mb-4 text-slate-700">⚙️ 核心配置</h3>
                <div class="space-y-3">
                    <input type="text" id="proxyIP" class="w-full p-2 bg-white rounded-lg border border-slate-200 text-sm" placeholder="优选 IP">
                    <input type="text" id="password" class="w-full p-2 bg-white rounded-lg border border-slate-200 text-sm" placeholder="Trojan 密码">
                </div>
            </div>
        </div>

        <div class="glass p-6 rounded-2xl">
            <h3 class="font-bold mb-4 text-slate-700">🛣️ 分流规则 (Bypass List)</h3>
            <textarea id="bypassList" rows="5" class="w-full p-3 bg-white rounded-lg border border-slate-200 text-sm font-mono" placeholder="每行一个域名，例如: *.cn"></textarea>
            <p class="text-[10px] text-slate-400 mt-2 italic">提示：直连名单内的域名将绕过代理直连。</p>
        </div>
    </div>

    <script>
        let AUTH = "";
        async function login() {
            const pwd = document.getElementById('adminPassword').value;
            const res = await fetch('/api/config', { headers: { 'Authorization': pwd } });
            if (res.ok) {
                AUTH = pwd;
                document.getElementById('loginOverlay').remove();
                document.getElementById('mainContent').classList.remove('opacity-0');
                const data = await res.json();
                document.getElementById('proxyIP').value = data.PROXY_IP || '';
                document.getElementById('password').value = data.PASSWORD || '';
                document.getElementById('bypassList').value = data.BYPASS_LIST || '';
                testPing();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        async function testPing() {
            const start = Date.now();
            try {
                const res = await fetch('/api/ping', { headers: { 'Authorization': AUTH } });
                if (res.ok) {
                    document.getElementById('pingStatus').innerText = "在线 (Online)";
                    document.getElementById('pingMs').innerText = `延迟: ${Date.now() - start} ms`;
                }
            } catch(e) { document.getElementById('pingStatus').innerText = "超时"; }
        }

        async function saveConfig() {
            const pwd = document.getElementById('password').value;
            const config = {
                PROXY_IP: document.getElementById('proxyIP').value,
                PASSWORD: pwd,
                TROJAN_HASH: CryptoJS.SHA224(pwd).toString(),
                BYPASS_LIST: document.getElementById('bypassList').value
            };
            const res = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Authorization': AUTH, 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            });
            if (res.ok) alert('同步成功，节点已生效！');
        }
    </script>
</body>
</html>
